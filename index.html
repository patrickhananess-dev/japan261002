/* ========================= 파서 ========================= */
const RUBY=/([0-9０-９]*[一-鿿々〆ヶ]+)[（(]([ぁ-ゖァ-ヶー]+)[）)]/g;
function splitRuby(t){return {t:t.replace(RUBY,'$1').replace(/\s+/g,' ').trim(), r:t.replace(RUBY,'$2').replace(/\s+/g,' ').trim()};}
function parseMd(md){
  const out=[];let cur=null,last=null;
  const start=t=>{cur={id:'sc:'+t,title:t,roleA:'',roleB:'',lines:[]};out.push(cur);last=null;};
  for(const raw of md.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    let m;
    if((m=line.match(/^#{1,2}\s+(.+)$/))){start(m[1].trim());continue;}
    if(line.startsWith('###')) continue;
    if((m=line.match(/^[*\-]\s*\*\*(.+?)\*\*\s*[:：]\s*(.*)$/))){
      if(!cur)start('내 대화');
      const spk=m[1]; let body=m[2].trim();
      const who=/점|직원|clerk|staff|host|店/i.test(spk)?'A':'B';
      let nm=spk.replace(/[（(].*?[）)]/g,'').trim();
      if(nm==='점')nm='점원'; if(nm==='손')nm='손님';
      if(who==='A'&&!cur.roleA)cur.roleA=nm; if(who==='B'&&!cur.roleB)cur.roleB=nm;
      let alts=[];
      const am=body.match(/[（(]\s*(?:또는|또|alt|대체)\s*[:：]?\s*(.+)[）)]\s*$/i);
      if(am){alts=am[1].split(/\s*[\/／]\s*/).map(x=>x.trim()).filter(Boolean);body=body.slice(0,am.index).trim();}
      let note='';
      const sm=body.match(/^[（(]([^）)]*[가-힣][^）)]*)[）)]\s*/);
      if(sm){note=sm[1];body=body.slice(sm[0].length);}
      const main=splitRuby(body);
      const l={who,ja:main.t,rd:main.r,ko:'',note,alts:alts.map(splitRuby)};
      cur.lines.push(l); last=l; continue;
    }
    if(last&&!last.ko&&(m=line.match(/^[（(](.+)[）)]$/))){last.ko=m[1].trim();continue;}
  }
  out.forEach(s=>{s.roleA=s.roleA||'점원';s.roleB=s.roleB||'손님';});
  return out.filter(s=>s.lines.length);
}
function ro(n){const c=(n||'').slice(-1).charCodeAt(0)-0xAC00;return (c>=0&&c<11172&&(c%28===0||c%28===8))?'로':'으로';}
function allScen(){
  const built=parseMd(DEFAULT_MD);
  const ids=new Set(userScen.map(u=>u.id));
  return built.filter(b=>!ids.has(b.id)).concat(userScen);
}
let scenarios=allScen();

/* ========================= 채점 ========================= */
const hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function norm(s){return hira((s||'').normalize('NFKC')).toLowerCase().replace(/[^ぁ-ゖー一-鿿々a-z0-9]/g,'');}
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}p=c;}
  return p[n];
}
function sim(a,b){
  if(!a||!b)return 0;
  let s=1-lev(a,b)/Math.max(a.length,b.length);
  if(a.length>=4&&b.includes(a)) s=Math.max(s,0.85);
  return s;
}
function candidates(l){
  const c=[{t:l.ja,r:l.rd}].concat(l.alts||[]); const set=new Set();
  c.forEach(x=>{const a=norm(x.t),b=norm(x.r);if(a)set.add(a);if(b)set.add(b);});
  return [...set];
}
function bestScore(l,heard){
  const cs=candidates(l); let best=0;
  heard.forEach(h=>{const n=norm(h);cs.forEach(c=>{best=Math.max(best,sim(c,n));});});
  return Math.round(best*100);
}

let voices=[]; let stopper=null;
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));}catch(e){voices=[];}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function stopAudio(){if(stopper){const f=stopper;stopper=null;try{f()}catch(e){}}}
function speakDevice(text,who){
  return new Promise(res=>{
    try{speechSynthesis.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=S.rate;
    const pick=uri=>voices.find(v=>v.voiceURI===uri);
    const vA=pick(S.dvA)||voices[0], vB=pick(S.dvB)||voices[1]||voices[0];
    const v=who==='A'?vA:vB; if(v)u.voice=v;
    if(vA===vB) u.pitch=who==='A'?1.15:0.85;
    let done=false;
    const fin=()=>{if(done)return;done=true;clearTimeout(t);res();};
    const t=setTimeout(fin,text.length*450/S.rate+4000);
    u.onend=fin;u.onerror=fin;
    stopper=()=>{try{speechSynthesis.cancel();}catch(e){}fin();};
    try{speechSynthesis.speak(u);}catch(e){fin();}
  });
}
const gcache=new Map();
async function gFetch(text,who){
  const name=who==='A'?S.gvA:S.gvB; const k=name+'|'+S.rate+'|'+text;
  if(gcache.has(k))return gcache.get(k);
  const r=await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key='+encodeURIComponent(S.gkey),{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({input:{text},voice:{languageCode:'ja-JP',name},audioConfig:{audioEncoding:'MP3',speakingRate:S.rate}})});
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('Google 음성 오류 '+r.status+' '+m);}
  const j=await r.json(); const url='data:audio/mp3;base64,'+j.audioContent; gcache.set(k,url); return url;
}
function playUrl(url){
  return new Promise(res=>{
    const a=new Audio(url); let done=false;
    const fin=()=>{if(done)return;done=true;res();};
    a.onended=fin;a.onerror=fin;
    stopper=()=>{try{a.pause()}catch(e){}fin();};
    a.play().catch(fin);
  });
}
let gWarned=false;
async function speak(text,who){
  stopAudio();
  if(S.engine==='google'&&S.gkey){
    try{const url=await gFetch(text,who);return await playUrl(url);}
    catch(e){ if(!gWarned){gWarned=true;toast(e.message+' (기기 음성으로 대체합니다)');} }
  }
  return speakDevice(text,who);
}
function prefetch(items){
  if(S.engine!=='google'||!S.gkey)return;
  items.forEach(x=>{gFetch(x.text,x.who).catch(()=>{});});
}

/* ========================= 음성 인식 ========================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let curRec=null;
function listen(onInterim){
  return new Promise((res,rej)=>{
    if(!SR){rej({error:'unsupported'});return;}
    const r=new SR(); curRec=r;
    r.lang='ja-JP'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
    let fin=null,interim='',err=null;
    r.onresult=e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const rs=e.results[i];
        if(rs.isFinal){fin=Array.from(rs).map(a=>a.transcript);}
        else{interim=rs[0].transcript;if(onInterim)onInterim(interim);}
      }
    };
    r.onerror=e=>{err=e.error;};
    r.onend=()=>{curRec=null; if(fin)res(fin); else if(interim)res([interim]); else rej({error:err||'no-speech'});};
    try{r.start();}catch(e){rej({error:'start-failed'});}
  });
}
function errMsg(e){
  const c=e&&e.error;
  if(c==='not-allowed'||c==='service-not-allowed')return '마이크 권한이 꺼져 있습니다. 주소창 왼쪽 자물쇠 → 권한 → 마이크 허용을 눌러 주세요.';
  if(c==='no-speech')return '목소리가 들리지 않았어요. 다시 말해 보세요.';
  if(c==='network')return '음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
  if(c==='unsupported')return '이 브라우저는 음성 인식을 지원하지 않아요. Chrome으로 열어 주세요.';
  if(c==='aborted')return '';
  return '음성 인식에 실패했어요 ('+(c||'알 수 없음')+').';
}

function makeSeq(scen,me){return scen.lines.map((l,idx)=>({scen,l,idx,mine:l.who===me}));}
function startPractice(scen,role){
  const rounds=role==='swap'?['B','A']:[role];

}
function startReviewFrom(keys){
  const seq=[]; const sorted=keys.map(k=>{const [id,ix]=k.split('#');return {s:findScen(id),ix:+ix};}).filter(x=>x.s&&x.s.lines[x.ix]);
  sorted.forEach(x=>{
    if(x.ix>0){const prev=x.s.lines[x.ix-1]; if(prev.who!==x.s.lines[x.ix].who)seq.push({scen:x.s,l:prev,idx:x.ix-1,mine:false});}
    seq.push({scen:x.s,l:x.s.lines[x.ix],idx:x.ix,mine:true});
  });
  if(!seq.length){toast('복습할 문장이 없습니다.');return;}
  P={scen:null,rounds:['review'],ri:0,rounds_res:[],review:true,tok:0,customSeq:seq};
  beginRound();
}
function beginRound(){
  const r=P.rounds[P.ri];

function renderProg(){const e=$('#prog');if(e)e.textContent=`${Math.min(P.i+1,P.seq.length)}/${P.seq.length} · 내 역할: ${myRoleName()}${P.rounds.length>1?` (${P.ri+1}/${P.rounds.length}라운드)`:''}`;}

async function step(){
  const st=P.seq[P.i];
  if(!st){endRound();return;}
  renderProg();
  P.tok++; const tok=P.tok; P.err=''; P.hintOn=false; P.attempts=0; P.best=null; P.ok=false; P.forced=false;
  if(!st.mine){
    P.phase='speaking';
    const entry={scen:st.scen,l:st.l,hide:!S.showJa}; P.log.push(entry); P.curEntry=entry;
    P.peekable=!S.showJa; P.lastOther={text:st.l.ja,who:st.l.who};
    renderLog();renderPanel();
    await speak(st.l.ja,st.l.who);
    if(!P||P.tok!==tok)return;
    P.phase='heard';renderPanel();
    if(S.autoNext&&S.showJa){setTimeout(()=>{if(P&&P.tok===tok&&P.phase==='heard')next();},600);}
  }else{
    P.phase='answer';renderPanel();
  }
}
function next(){
  stopAudio();
  const st=P.seq[P.i];
  if(st.mine){
    const best=P.best==null?0:P.best; const ok=P.ok;
    P.res.push({scen:st.scen,idx:st.idx,l:st.l,best,ok});
    const key=st.scen.id+'#'+st.idx;
    if(ok){delete weak[key];}else{weak[key]=(weak[key]||0)+1;}
    store.set('j261002.weak',weak);
    P.log.push({me:true,l:st.l,ok,score:best});
  }
  P.tok++; P.i++; step();
}

async function doMic(){

    if(!P||P.tok!==tok)return;

  }catch(e){
    if(!P||P.tok!==tok)return;
    P.fail++; P.phase='answer'; P.err=errMsg(e); renderPanel();
  }
}
function gradeVoice(alts){
  const st=P.seq[P.i]; const score=bestScore(st.l,alts); const ok=score>=S.thr;
  P.attempts++; P.best=Math.max(P.best||0,score); P.ok=P.ok||ok;
  P.last={alts,score,ok,forced:false}; P.phase='result'; renderPanel();
}
function selfGrade(ok){
  P.attempts++; P.best=ok?100:0; P.ok=ok; P.forced=ok;
  next();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  try{ acts[a]&&acts[a](b); }catch(err){ toast('오류: '+err.message); }
});
const acts={
  settings(){go('settings');},
  content(){go('content');},
  home(){stopAudio();try{curRec&&curRec.abort();}catch(e){} P=null; go('home');},
  quit(){stopAudio();try{curRec&&curRec.abort();}catch(e){} if(P)P.tok++; P=null; go('home');},
  start(b){startPractice(findScen(b.dataset.id),b.dataset.role);},
  review(){startReviewFrom(Object.keys(weak));},
  clearweak(){weak={};store.set('j261002.weak',weak);render();},
  skipTalk(){stopAudio();},
  replay(){const t=P.lastOther;if(!t)return;const tok=++P.tok;const keep=P.phase;speak(t.text,t.who).then(()=>{if(P&&P.tok===tok&&keep==='heard'){P.phase='heard';}});},
  peek(){if(P.curEntry){P.curEntry.hide=false;P.peekable=false;renderLog();renderPanel();}},
  next(){next();},
  mic(){doMic();},
  stopmic(){try{curRec&&curRec.stop();}catch(e){}},
  reveal(){stopAudio();P.phase='revealed';renderPanel();},
  hearAns(){const st=P.seq[P.i];speak(st.l.ja,st.l.who);},
  selfOk(){selfGrade(true);},
  selfNg(){selfGrade(false);},
  force(){P.ok=true;P.forced=true;P.last.ok=true;P.last.forced=true;P.last.score=Math.max(P.last.score,100);P.best=100;renderPanel();},
  skip(){P.best=0;P.ok=false;next();},
  showhint(){P.hintOn=true;renderPanel();},
  modeReveal(){S.grade='reveal';saveS();P.err='';P.phase='answer';renderPanel();toast('정답 공개 방식으로 바꿨습니다. 설정에서 되돌릴 수 있어요.');},
  swapGo(){P.ri++;beginRound();},
  retry(){const keys=[];P.rounds_res.forEach(r=>r.res.forEach(x=>{if(!x.ok)keys.push(x.scen.id+'#'+x.idx);}));startReviewFrom(keys);},
  again(){const s=P.scen,role=P.rounds.length>1?'swap':P.rounds[0]; if(P.review){startReviewFrom(Object.keys(weak));}else startPractice(s,role);},
  saveContent(){saveContent();},
  fillTemplate(){$('#md').value=TEMPLATE_MD;},
  delScen(b){userScen=userScen.filter(u=>u.id!==b.dataset.id);store.set('jp.userScen',userScen);scenarios=allScen();rContent();toast('삭제했습니다.');},
  testVoiceA(){speak('いらっしゃいませ。ご注文はお決まりですか？','A');},
  testVoiceB(){speak('ホットコーヒーをお願いします。','B');},
  testMic(){testMic();}
};

/* ========================= 교대 / 결과 ========================= */
function rSwap(){
  const next=P.rounds[P.ri+1]; const name=next==='A'?P.scen.roleA:P.scen.roleB;
  app.innerHTML=`<header class="top"><h1>역할 교대</h1></header><section class="card"><h2>1라운드 끝</h2><p class="meta">이제 당신은 <b>${esc(name)}</b> 역할입니다. 상대 대사는 음성으로 나옵니다.</p><div class="row"><button class="btn" data-act="swapGo">${esc(name)}로 시작</button></div></section>`;
}
function rSummary(){
  const blocks=P.rounds_res.map(r=>{
    const n=r.res.length; const okN=r.res.filter(x=>x.ok).length; const avg=n?Math.round(r.res.reduce((a,x)=>a+x.best,0)/n):0;
    const nm=P.review?'복습':(r.role==='A'?P.scen.roleA:P.scen.roleB);
    return `<section class="card"><h2>${esc(nm)} 라운드</h2><div class="row" style="align-items:center"><div class="big">${okN}/${n}</div><div class="meta" style="flex:3">통과 · 평균 유사도 ${avg}%</div></div>
    ${r.res.map(x=>`<div class="sumrow"><div class="mk ${x.ok?'ok':'ng'}">${x.ok?'✓':'✗'}</div><div><div>${esc(x.l.ja)}</div><div class="ko muted">${esc(x.l.ko||'')} · ${x.best}%</div></div></div>`).join('')}</section>`;
  }).join('');
  const anyBad=P.rounds_res.some(r=>r.res.some(x=>!x.ok));
  app.innerHTML=`<header class="top"><h1>연습 결과</h1></header>${blocks}
  <div class="row" style="margin-bottom:16px">${anyBad?'<button class="btn" data-act="retry">틀린 문장만 다시</button>':''}<button class="btn ghost" data-act="again">처음부터 다시</button><button class="btn ghost" data-act="home">처음 화면</button></div>`;
}

/* ========================= 설정 ========================= */
function rSettings(){
  loadVoices();
  const vopts=sel=>'<option value="">자동</option>'+voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===sel?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  const sw=(k,t,d)=>`<div class="sw"><div><div>${t}</div>${d?`<div class="d muted" style="font-size:.8rem">${d}</div>`:''}</div><input type="checkbox" data-k="${k}" ${S[k]?'checked':''} aria-label="${t}"></div>`;
  app.innerHTML=`<header class="top"><h1>설정</h1><button class="icon" data-act="home" aria-label="닫기">✕</button></header>
  <section class="card"><h2>채점 방식</h2>
    <div class="seg" style="margin-block:8px"><label><input type="radio" name="grade" data-k="grade" value="voice" ${S.grade==='voice'?'checked':''}><span>🎤 음성 인식</span></label><label><input type="radio" name="grade" data-k="grade" value="reveal" ${S.grade==='reveal'?'checked':''}><span>👀 정답 공개</span></label></div>
    <div class="field"><label for="thr">통과 기준 유사도: <b id="thrv">${S.thr}</b>%</label><input type="range" id="thr" data-k="thr" data-n="1" min="50" max="95" step="5" value="${S.thr}"><div class="d muted">낮출수록 비슷하게만 말해도 통과합니다. 조사나 말끝이 조금 달라도 인정하려면 65~75%를 권장합니다.</div></div>
    <div class="row"><button class="btn ghost" data-act="testMic">🎤 마이크 시험</button></div><div id="micTest" class="muted" style="margin-top:6px"></div>
  </section>
  <section class="card"><h2>음성 (상대 대사)</h2>
    <div class="field"><label for="engine">음성 엔진</label><select id="engine" data-k="engine"><option value="device" ${S.engine==='device'?'selected':''}>기기 기본 음성 (무료)</option><option value="google" ${S.engine==='google'?'selected':''}>Google Cloud 음성 (자연스러움)</option></select></div>
    <div class="field"><label for="rate">말하는 속도: <b id="ratev">${S.rate.toFixed(2)}</b></label><input type="range" id="rate" data-k="rate" data-n="1" min="0.6" max="1.2" step="0.05" value="${S.rate}"></div>
    <div class="field"><label for="dvA">기기 음성 - 역할 A (점원 등)</label><select id="dvA" data-k="dvA">${vopts(S.dvA)}</select></div>
    <div class="field"><label for="dvB">기기 음성 - 역할 B (손님 등)</label><select id="dvB" data-k="dvB">${vopts(S.dvB)}</select></div>
    <div class="field"><label for="gkey">Google Cloud API 키</label><input type="password" id="gkey" data-k="gkey" value="${esc(S.gkey)}" autocomplete="off" placeholder="AIza..."><div class="d muted">이 폰의 브라우저에만 저장됩니다.</div></div>
    <div class="field"><label for="gvA">Google 음성 - 역할 A</label><input type="text" id="gvA" list="gv" data-k="gvA" value="${esc(S.gvA)}"></div>
    <div class="field"><label for="gvB">Google 음성 - 역할 B</label><input type="text" id="gvB" list="gv" data-k="gvB" value="${esc(S.gvB)}"></div>
    <datalist id="gv"><option value="ja-JP-Neural2-B"><option value="ja-JP-Neural2-C"><option value="ja-JP-Neural2-D"><option value="ja-JP-Wavenet-A"><option value="ja-JP-Wavenet-B"><option value="ja-JP-Wavenet-C"><option value="ja-JP-Wavenet-D"></datalist>
    <div class="row"><button class="btn ghost" data-act="testVoiceA">▶ A 음성 듣기</button><button class="btn ghost" data-act="testVoiceB">▶ B 음성 듣기</button></div>
    <details style="margin-top:12px"><summary>Google Cloud 음성 설정 방법</summary><ol>
      <li>console.cloud.google.com 에서 프로젝트를 만들고 결제 계정을 연결합니다.</li>
      <li>"Cloud Text-to-Speech API"를 사용 설정합니다.</li>
      <li>API 및 서비스 → 사용자 인증 정보 → API 키 만들기.</li>
      <li>키 제한에서 API를 "Cloud Text-to-Speech API"만 허용하고, 가능하면 이 앱 주소로 웹사이트 제한을 겁니다.</li>
      <li>위 칸에 키를 붙여 넣고 음성 엔진을 Google로 바꿉니다.</li></ol>
      <p>요금 정책은 Google 공식 요금표를 확인하세요. 연습 분량(문장당 수십 자)이면 사용량이 매우 적습니다.</p></details>
  </section>
  <section class="card"><h2>화면 표시</h2>
    ${sw('showJa','상대 대사 텍스트 보이기','끄면 듣기만으로 연습합니다 (필요할 때 텍스트 보기 가능)')}
    ${sw('showKoOther','상대 대사 한국어 뜻 보이기')}
    ${sw('showRd','읽는 법(히라가나) 보이기')}
    ${sw('hint','내 차례에 한국어 힌트 보이기')}
    ${sw('autoNext','상대 대사가 끝나면 자동으로 다음으로','텍스트 보이기가 켜져 있을 때 적용')}
  </section>
  <div class="row"><button class="btn" data-act="home">완료</button></div>`;
}
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.k; if(!k)return;
  let v=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(e.target.dataset.n)v=parseFloat(v);
  if(e.target.type==='radio'&&!e.target.checked)return;
  S[k]=v; saveS();
  if(k==='thr'){const x=$('#thrv');if(x)x.textContent=v;}
  if(k==='rate'){const x=$('#ratev');if(x)x.textContent=Number(v).toFixed(2);}
});
async function testMic(){
  const el=$('#micTest'); el.textContent='🎤 아무 일본어나 말해 보세요…';
  try{const a=await listen();el.textContent='인식 결과: '+a[0];}
  catch(e){el.textContent=errMsg(e)||'취소됨';}
}

/* ========================= 콘텐츠 가져오기 ========================= */
function rContent(){
  app.innerHTML=`<header class="top"><h1>콘텐츠 추가</h1><button class="icon" data-act="home" aria-label="닫기">✕</button></header>
  <p class="sub">대화를 아래 형식으로 붙여 넣거나 파일(.md, .txt)로 불러오세요. 제목은 <b># 제목</b> 줄로 구분하며, 한 파일에 여러 상황을 넣을 수 있습니다.</p>
  <div class="field"><label for="file">파일 불러오기</label><input type="file" id="file" accept=".md,.txt,text/plain,text/markdown"></div>
  <div class="field"><label for="md">대화 내용</label><textarea id="md" placeholder="# 상황 제목&#10;* **점원**: 일본어&#10;  (한국어 뜻)&#10;* **손님**: 일본어 (또는 다른 정답 / 또 다른 정답)&#10;  (한국어 뜻)"></textarea></div>
  <div class="row"><button class="btn" data-act="saveContent">저장하고 추가</button><button class="btn ghost" data-act="fillTemplate">예시 넣기</button></div>
  <details style="margin-top:12px"><summary>작성 규칙</summary><ol>
    <li>화자 줄: <code>* **점원**: 일본어</code>, <code>* **손님**: 일본어</code></li>
    <li>바로 아래 줄에 <code>(한국어 뜻)</code></li>
    <li>한자 뒤에 읽는 법: <code>袋(ふくろ)</code>. 채점 정확도가 올라갑니다.</li>
    <li>정답 여러 개: 줄 끝에 <code>(또는 표현1 / 표현2)</code></li>
    <li>동작 설명: 대사 앞에 <code>（화면을 가리키며）</code></li>
    <li>점원, 직원, 호스트 등은 역할 A, 그 밖의 화자는 역할 B로 처리됩니다.</li></ol></details>
  <h2 style="font-size:1.05rem;margin-top:20px">내 콘텐츠</h2>
  ${userScen.length?userScen.map(u=>`<div class="sumrow"><div style="flex:1"><b>${esc(u.title)}</b><div class="meta">${u.lines.length}문장</div></div><button class="btn danger" data-act="delScen" data-id="${esc(u.id)}" style="flex:0 0 auto">삭제</button></div>`).join(''):'<p class="muted">추가한 콘텐츠가 없습니다.</p>'}`;
  $('#file').addEventListener('change',ev=>{
    const f=ev.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{$('#md').value=r.result;}; r.readAsText(f,'utf-8');
  });
}
function saveContent(){
  const md=$('#md').value; if(!md.trim()){toast('내용을 입력해 주세요.');return;}
  const list=parseMd(md);
  if(!list.length){toast('대화를 찾지 못했습니다. 작성 규칙을 확인해 주세요.');return;}
  const ids=new Set(list.map(x=>x.id));
  userScen=userScen.filter(u=>!ids.has(u.id)).concat(list);
  store.set('jp.userScen',userScen); scenarios=allScen();
  toast(list.length+'개 상황을 추가했습니다.'); go('home');
}

render();
</script>
